<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">He Dong — AI systems and agent infrastructure engineer</title>
  <desc id="desc">He Dong builds AI agents that stay observable, reviewable, and safe to operate. 10 merged pull requests to Everything Claude Code, a top-10 contributor by commits, a selected contributor to the XERJ Corpus Hub, and an MR review cycle cut from 30 to 3 minutes at ByteDance.</desc>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 89px 79px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101F"/>
      <stop offset="0.6" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#121A36"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#93C5FD" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 40) rotate(90) scale(300 420)">
      <stop stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect width="1280" height="420" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect width="1280" height="3" fill="url(#line)"/>
  </g>

  <circle class="pulse" cx="89" cy="79" r="6" fill="#22D3EE"/>
  <text x="108" y="85" class="mono" fill="#7DD3FC" font-size="17" font-weight="600" letter-spacing="2.6">AI SYSTEMS · AGENT INFRASTRUCTURE · DEVELOPER TOOLING</text>

  <text x="78" y="178" class="sans" fill="#F8FAFC" font-size="86" font-weight="700" letter-spacing="-2.5">He Dong</text>
  <text x="82" y="228" class="sans" fill="#9FB3CE" font-size="27" font-weight="400">I build AI agents that stay <tspan fill="#F1F5F9" font-weight="600">observable, reviewable, and safe to operate.</tspan></text>

  <text x="1198" y="172" class="mono" text-anchor="end" fill="#7189AA" font-size="17" letter-spacing="0.4">observe <tspan fill="#38BDF8">→</tspan> reproduce <tspan fill="#60A5FA">→</tspan> locate <tspan fill="#818CF8">→</tspan> patch <tspan fill="#A78BFA">→</tspan> verify</text>

  <path d="M82 272H1198" stroke="#22344F" stroke-width="1.5"/>

  <g class="sans">
    <g transform="translate(82 0)">
      <text y="330" fill="#F8FAFC" font-size="42" font-weight="700" letter-spacing="-1">10</text>
      <text y="362" fill="#C7D5E8" font-size="18" font-weight="500">merged PRs</text>
      <text y="388" fill="#6F87A6" font-size="17">Everything Claude Code</text>
    </g>
    <path d="M362 296V392" stroke="#22344F" stroke-width="1.5"/>
    <g transform="translate(392 0)">
      <text y="330" fill="#F8FAFC" font-size="42" font-weight="700" letter-spacing="-1">Top 10</text>
      <text y="362" fill="#C7D5E8" font-size="18" font-weight="500">contributor by commits</text>
      <text y="388" fill="#6F87A6" font-size="17">ECC · 280k+ stars</text>
    </g>
    <path d="M672 296V392" stroke="#22344F" stroke-width="1.5"/>
    <g transform="translate(702 0)">
      <text y="330" fill="#C4B5FD" font-size="42" font-weight="700" letter-spacing="-1">Selected</text>
      <text y="362" fill="#C7D5E8" font-size="18" font-weight="500">corpus contributor</text>
      <text y="388" fill="#6F87A6" font-size="17">XERJ Corpus Hub</text>
    </g>
    <path d="M952 296V392" stroke="#22344F" stroke-width="1.5"/>
    <g transform="translate(982 0)">
      <text y="330" fill="#F8FAFC" font-size="42" font-weight="700" letter-spacing="-1">30→3 min</text>
      <text y="362" fill="#C7D5E8" font-size="18" font-weight="500">per MR review cycle</text>
      <text y="388" fill="#6F87A6" font-size="17">ByteDance AI engineering</text>
    </g>
  </g>
</svg>
