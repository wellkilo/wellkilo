<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">He Dong — AI systems and agent infrastructure engineer</title>
  <desc id="desc">A dark technical banner showing an evidence-first engineering workflow from observation to verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101F"/>
      <stop offset="0.58" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#111B35"/>
    </linearGradient>
    <linearGradient id="line" x1="132" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#93C5FD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <path d="M0 1H1280" stroke="url(#line)" stroke-width="2"/>
  <circle cx="1138" cy="78" r="145" fill="#2563EB" fill-opacity="0.06"/>
  <circle cx="1172" cy="48" r="82" fill="#8B5CF6" fill-opacity="0.07"/>

  <g transform="translate(86 70)">
    <rect width="48" height="48" rx="10" fill="#0E203D" stroke="#22D3EE" stroke-opacity="0.6"/>
    <path d="M14 15V33M34 15V33M14 24H34" stroke="#E6F7FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="10" r="4" fill="#22D3EE" filter="url(#glow)"/>
  </g>

  <text x="154" y="88" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="3">ENGINEERING SYSTEMS / 2026</text>
  <text x="86" y="182" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="66" font-weight="760" letter-spacing="-2">HE DONG</text>
  <text x="89" y="224" fill="#AFC2DC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="450" letter-spacing="0.3">AI SYSTEMS  ·  AGENT INFRASTRUCTURE  ·  DEVELOPER TOOLING</text>

  <g transform="translate(88 301)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <line x1="9" y1="9" x2="1008" y2="9" stroke="#28415E" stroke-width="2"/>
    <line x1="9" y1="9" x2="1008" y2="9" stroke="url(#line)" stroke-width="2" stroke-dasharray="198 22"/>

    <g transform="translate(0)">
      <circle cx="9" cy="9" r="9" fill="#22D3EE" fill-opacity="0.18" stroke="#22D3EE"/>
      <circle cx="9" cy="9" r="3" fill="#CFFAFE"/>
      <text x="0" y="48" fill="#D9E8F5" font-size="14" letter-spacing="1.5">OBSERVE</text>
      <text x="0" y="70" fill="#66819F" font-size="12">capture the signal</text>
    </g>
    <g transform="translate(220)">
      <circle cx="9" cy="9" r="9" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8"/>
      <circle cx="9" cy="9" r="3" fill="#E0F2FE"/>
      <text x="0" y="48" fill="#D9E8F5" font-size="14" letter-spacing="1.5">REPRODUCE</text>
      <text x="0" y="70" fill="#66819F" font-size="12">freeze the baseline</text>
    </g>
    <g transform="translate(445)">
      <circle cx="9" cy="9" r="9" fill="#60A5FA" fill-opacity="0.18" stroke="#60A5FA"/>
      <circle cx="9" cy="9" r="3" fill="#DBEAFE"/>
      <text x="0" y="48" fill="#D9E8F5" font-size="14" letter-spacing="1.5">LOCATE</text>
      <text x="0" y="70" fill="#66819F" font-size="12">prove the cause</text>
    </g>
    <g transform="translate(650)">
      <circle cx="9" cy="9" r="9" fill="#818CF8" fill-opacity="0.18" stroke="#818CF8"/>
      <circle cx="9" cy="9" r="3" fill="#E0E7FF"/>
      <text x="0" y="48" fill="#D9E8F5" font-size="14" letter-spacing="1.5">PATCH</text>
      <text x="0" y="70" fill="#66819F" font-size="12">change the minimum</text>
    </g>
    <g transform="translate(870)">
      <circle cx="9" cy="9" r="9" fill="#A78BFA" fill-opacity="0.18" stroke="#A78BFA" filter="url(#glow)"/>
      <circle cx="9" cy="9" r="3" fill="#EDE9FE"/>
      <text x="0" y="48" fill="#F1EFFF" font-size="14" letter-spacing="1.5">VERIFY</text>
      <text x="0" y="70" fill="#7F729D" font-size="12">preserve the evidence</text>
    </g>
  </g>

  <g transform="translate(1123 300)">
    <rect width="84" height="84" rx="16" fill="#0D1D35" stroke="#2A4667"/>
    <path d="M24 42L37 55L62 29" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="106" text-anchor="middle" fill="#66819F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">AUDITABLE</text>
  </g>
</svg>
